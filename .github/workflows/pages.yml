name: Rodokmen na GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'web_rodokmen/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check website entry point
        run: test -f web_rodokmen/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_rodokmen
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
